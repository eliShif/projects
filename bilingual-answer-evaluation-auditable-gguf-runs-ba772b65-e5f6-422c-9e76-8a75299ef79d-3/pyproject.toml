[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-answer-evaluation"
version = "0.3.0"
description = "Bilingual evaluation with frozen local GGUF protocols, failure journals and scoring replay"
