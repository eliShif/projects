[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-security-triage"
version = "0.1.0"
description = "Bounded security triage and reproducible adaptation experiments"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
ml = ["numpy==2.3.5", "scipy==1.17.0", "scikit-learn==1.8.0", "torch>=2.9,<3", "transformers>=4.48,<5", "safetensors>=0.4", "huggingface-hub<1", "openai>=2,<3"]

[tool.setuptools.packages.find]
include = ["portfolio*"]
